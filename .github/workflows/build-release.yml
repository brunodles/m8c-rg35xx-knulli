name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the release (e.g. v1.0.0). Leave empty to skip creating a GitHub release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run build script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Prepare release metadata
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.tag }}" != '' ]]; then
            TAG="${{ github.event.inputs.tag }}"
            SHOULD_RELEASE=true
          elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
            TAG="${GITHUB_REF_NAME}"
            SHOULD_RELEASE=true
          else
            TAG="${GITHUB_REF_NAME}"
            SHOULD_RELEASE=false
          fi
          ASSET_NAME="m8c-output-${TAG}.tar.gz"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Archive output
        run: |
          [ -d output ] || { echo "Error: output directory not found"; exit 1; }
          tar -czf "${{ steps.meta.outputs.asset_name }}" output

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: output-${{ steps.meta.outputs.tag }}
          path: ${{ steps.meta.outputs.asset_name }}

      - name: Create GitHub release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          files: ${{ steps.meta.outputs.asset_name }}
          generate_release_notes: true
